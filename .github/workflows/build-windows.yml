name: Build psiconv for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install MSYS2 and MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            pkgconf
            file
            mingw-w64-ucrt-x86_64-gcc

      - name: Display compiler information
        run: |
          echo "MSYSTEM=$MSYSTEM"
          pwd
          gcc --version
          make --version
          autoreconf --version

      - name: Regenerate build files
        run: |
          rm -f config.cache config.log config.status
          autoreconf -fiv

      - name: Configure Windows build
        run: |
          ./configure \
            --host=x86_64-w64-mingw32 \
            --build=x86_64-pc-msys \
            --with-imagemagick=no \
            --disable-shared \
            --enable-static \
            CFLAGS="-O2"

      - name: Compile psiconv
        run: |
          make V=1 -j2

      - name: Locate executable
        run: |
          echo "Recherche des exécutables produits :"
          find . -type f -iname "*.exe" -print

          mkdir -p dist

          EXE="program/psiconv/psiconv.exe"

          if [ ! -f "$EXE" ]; then
            EXE="program/psiconv/.libs/psiconv.exe"
          fi

          if [ ! -f "$EXE" ]; then
            echo "ERREUR : psiconv.exe est introuvable."
            exit 1
          fi

          cp "$EXE" dist/psiconv.exe

          if [ -f COPYING ]; then
            cp COPYING dist/COPYING.txt
          fi

          cat > dist/README.txt <<'EOF'
          psiconv pour Windows 64 bits

          Pour afficher l'aide :

              psiconv.exe --help

          La prise en charge d'ImageMagick est désactivée.
          EOF

          file dist/psiconv.exe

      - name: Test executable
        shell: pwsh
        run: |
          Get-Item ".\dist\psiconv.exe"
          & ".\dist\psiconv.exe" --help
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Le programme a renvoyé le code $LASTEXITCODE pendant le test."
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: psiconv-windows-x64
          path: dist
          if-no-files-found: error
